name: CI TaskAPI
on: push:
   branches: [main]
    pull_request:
       branches: [main]
      workflow_dispatch:
jobs: 
  test:
     runs-on: ubuntu-latest
steps:
  - name: Recuperer le code
    uses: actions/checkout@v4

  - name: Installer Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Installer les dependances
    run: npm ci

  - name: Executer les tests
    run: npm test