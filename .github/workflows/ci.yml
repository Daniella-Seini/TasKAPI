name: CI TaskAPI
on: push: pull_request:
jobs: test: runs-on: ubuntu-latest
steps:
  - name: Recuperer le code
    uses: actions/checkout@v4

  - name: Installer Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "22"
      cache: npm

  - name: Installer les dependances
    run: npm ci

  - name: Lancer les tests
    run: npm test